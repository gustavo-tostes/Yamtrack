{% load app_tags %}

{% include "app/components/messages/messages_oob.html" %}

<div class="pb-0">
  <div class="flex items-center gap-2">
    <button class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-white/10 bg-white/5 text-gray-400 transition-colors hover:bg-white/10 hover:text-white cursor-pointer disabled:opacity-35 disabled:hover:bg-white/5 disabled:cursor-not-allowed"
            {% if media.progress == 0 %}disabled{% endif %}
            title="Diminuir progresso"
            hx-post="{% url 'progress_edit' media.item.media_type media.id %}"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-vals='{"operation": "decrease"}'
            hx-swap="innerHTML"
            hx-target="#progress-{{ media.item.media_type }}-{{ media.id }}">
      {% include "app/icons/minus.svg" with classes="w-3 h-3" %}
    </button>

    <button class="flex h-7 shrink-0 items-center justify-center rounded-md border border-white/10 bg-white/5 px-3 text-xs font-semibold text-indigo-200 transition-colors hover:bg-white/10 hover:text-white cursor-pointer disabled:opacity-35 disabled:hover:bg-white/5 disabled:cursor-not-allowed whitespace-nowrap"
            {% if media.progress == media.max_progress %}disabled{% endif %}
            title="Marcar próximo episódio"
            hx-post="{% url 'progress_edit' media.item.media_type media.id %}"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-vals='{"operation": "increase"}'
            hx-swap="innerHTML"
            hx-target="#progress-{{ media.item.media_type }}-{{ media.id }}">
      +1 episódio
    </button>
  </div>

  {% include "app/components/progress_bar.html" with media=media user=user %}
</div>
