{% load app_tags %}

{% include "app/components/messages/messages_oob.html" %}

<div class="flex items-center gap-3">
  <div class="min-w-0">
    {% include "app/components/progress_bar.html" with media=media user=user %}
  </div>

  <button class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white text-gray-700 shadow-sm transition-all duration-200 hover:scale-105 hover:bg-gray-100 cursor-pointer disabled:opacity-35 disabled:hover:scale-100 disabled:cursor-not-allowed"
          {% if media.progress == media.max_progress %}disabled{% endif %}
          title="Marcar próximo episódio"
          hx-post="{% url 'progress_edit' media.item.media_type media.id %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"operation": "increase"}'
          hx-swap="innerHTML"
          hx-target="#progress-{{ media.item.media_type }}-{{ media.id }}">
    ✓
  </button>
</div>
